services:
  nginx:
    image: nginx:stable-alpine
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/project
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - symfony-network

  php:
    build: ./docker/php
    depends_on:
      - db
    volumes:
      - .:/var/www/project
    networks:
      - symfony-network

  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: password
    networks:
      - symfony-network

  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - symfony-network

  redis:
    image: redis:7-alpine
    ports: [6379]
    networks:
      - symfony-network

networks:
  symfony-network:
    driver: bridge

volumes:
  db-data:
